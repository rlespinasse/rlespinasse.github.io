<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'SF Mono', 'Fira Code', monospace">
  <rect width="800" height="380" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" fill="#f0f6fc" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700">Sourcing lib.sh leaks state between tests</text>

  <!-- Test A -->
  <g transform="translate(50, 65)">
    <rect width="300" height="130" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <rect width="300" height="30" rx="8" fill="#21262d"/>
    <rect y="18" width="300" height="12" fill="#21262d"/>
    <text x="14" y="20" font-size="12.5" fill="#c9d1d9" font-weight="600">@test "reference mode"</text>

    <text x="14" y="56" font-size="12" fill="#8b949e">INPUT_MODE=</text>
    <text x="104" y="56" font-size="12" fill="#79c0ff">"reference"</text>
    <text x="14" y="76" font-size="12" fill="#8b949e">source lib.sh</text>
    <text x="14" y="96" font-size="12" fill="#8b949e">resolve_action_mode</text>

    <g transform="translate(268, 20)">
      <circle r="10" fill="#f8514920" stroke="#f85149" stroke-width="1.5"/>
      <line x1="-4" y1="-4" x2="4" y2="4" stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="-4" x2="-4" y2="4" stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="14" y="118" font-size="11" fill="#6e7681">no reset_inputs() called</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(400, 130)">
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#f85149" stroke-width="2.5"/>
    <polygon points="20,-7 34,0 20,7" fill="#f85149"/>
    <text x="0" y="-14" text-anchor="middle" font-size="11" fill="#f85149" font-family="sans-serif">same process</text>
  </g>

  <!-- Test B -->
  <g transform="translate(450, 65)">
    <rect width="300" height="130" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <rect width="300" height="30" rx="8" fill="#21262d"/>
    <rect y="18" width="300" height="12" fill="#21262d"/>
    <text x="14" y="20" font-size="12.5" fill="#c9d1d9" font-weight="600">@test "push mode"</text>

    <text x="14" y="56" font-size="12" fill="#8b949e">INPUT_MODE=</text>
    <text x="104" y="56" font-size="12" fill="#79c0ff">"push"</text>
    <text x="14" y="76" font-size="12" fill="#8b949e">resolve_action_mode</text>
    <text x="14" y="96" font-size="12" fill="#f85149">→ still "reference" !</text>

    <g transform="translate(268, 20)">
      <circle r="10" fill="#f8514920" stroke="#f85149" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-size="12" fill="#f85149" font-weight="700">✗</text>
    </g>
    <text x="14" y="118" font-size="11" fill="#6e7681">INPUT_MODE leftover from A</text>
  </g>

  <!-- Fix bar -->
  <g transform="translate(400, 250)">
    <rect x="-340" y="-24" width="680" height="80" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="-320" y="0" fill="#3fb950" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600">setup() { reset_inputs; }</text>
    <text x="-320" y="20" fill="#8b949e" font-size="12">reset_inputs() must unset() every INPUT_*/GITHUB_* var lib.sh reads —</text>
    <text x="-320" y="40" fill="#8b949e" font-size="12">add an input without updating it, and the leak is silent until a test order changes.</text>
  </g>
</svg>
