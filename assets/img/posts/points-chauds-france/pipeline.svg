<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="pcpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f06"/>
      <stop offset="100%" stop-color="#241408"/>
    </linearGradient>
    <marker id="pcpArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8a838"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#pcpBg)"/>

  <!-- Title -->
  <text x="400" y="32" font-family="'Inter', sans-serif" font-size="15" fill="#b0803c" text-anchor="middle" letter-spacing="2">PIPELINE DE DONNÉES · TOUTES LES 3 HEURES</text>

  <!-- Stage 1: NASA FIRMS (per satellite) -->
  <rect x="26" y="130" width="126" height="90" rx="6" fill="#241408" stroke="#8a6030" stroke-width="1.2"/>
  <g transform="translate(89, 158)" opacity="0.85">
    <circle cx="0" cy="0" r="9" fill="none" stroke="#e8a838" stroke-width="1.3"/>
    <line x1="-14" y1="-8" x2="-9" y2="-4" stroke="#e8a838" stroke-width="1.6"/>
    <line x1="14" y1="-8" x2="9" y2="-4" stroke="#e8a838" stroke-width="1.6"/>
    <rect x="-16" y="-11" width="6" height="6" fill="#e8a838" opacity="0.7"/>
    <rect x="10" y="-11" width="6" height="6" fill="#e8a838" opacity="0.7"/>
  </g>
  <text x="89" y="180" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e8a838" text-anchor="middle">NASA FIRMS</text>
  <text x="89" y="195" font-family="'Inter', sans-serif" font-size="8.5" fill="#8a6030" text-anchor="middle">VIIRS SNPP</text>
  <text x="89" y="207" font-family="'Inter', sans-serif" font-size="8.5" fill="#8a6030" text-anchor="middle">NOAA-20 / NOAA-21</text>
  <text x="89" y="255" font-family="'Inter', sans-serif" font-size="10" fill="#8a6030" text-anchor="middle" letter-spacing="1">SATELLITES</text>

  <!-- Arrow to fetch-firms.mjs -->
  <line x1="152" y1="175" x2="205" y2="175" stroke="#e8a838" stroke-width="1.4" marker-end="url(#pcpArrow)"/>

  <!-- Stage 2: fetch-firms.mjs -->
  <rect x="215" y="130" width="130" height="90" rx="6" fill="#1e2412" stroke="#6a8a4a" stroke-width="1.4"/>
  <text x="280" y="160" font-family="'SF Mono', monospace" font-size="10.5" font-weight="700" fill="#9aba6a" text-anchor="middle">fetch-firms</text>
  <text x="280" y="174" font-family="'SF Mono', monospace" font-size="10.5" font-weight="700" fill="#9aba6a" text-anchor="middle">.mjs</text>
  <text x="280" y="192" font-family="'Inter', sans-serif" font-size="8.5" fill="#6a8a4a" text-anchor="middle">géocodage inverse</text>
  <text x="280" y="204" font-family="'Inter', sans-serif" font-size="8.5" fill="#6a8a4a" text-anchor="middle">(geo.api.gouv.fr)</text>
  <text x="280" y="255" font-family="'Inter', sans-serif" font-size="10" fill="#8a6030" text-anchor="middle" letter-spacing="1">RÉCUPÉRATION</text>

  <!-- Arrow to FRP split -->
  <line x1="345" y1="175" x2="398" y2="175" stroke="#e8a838" stroke-width="1.4" marker-end="url(#pcpArrow)"/>

  <!-- Stage 3: FRP split -->
  <rect x="408" y="120" width="130" height="110" rx="6" fill="#241408" stroke="#8a6030" stroke-width="1.4"/>
  <text x="473" y="145" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#e8a838" text-anchor="middle">Répartition FRP</text>
  <circle cx="435" cy="165" r="5" fill="#fde047"/>
  <text x="448" y="169" font-family="'Inter', sans-serif" font-size="8.5" fill="#a08050">faible</text>
  <circle cx="435" cy="185" r="5" fill="#f97316"/>
  <text x="448" y="189" font-family="'Inter', sans-serif" font-size="8.5" fill="#a08050">modérée</text>
  <circle cx="435" cy="205" r="5" fill="#ef4444"/>
  <text x="448" y="209" font-family="'Inter', sans-serif" font-size="8.5" fill="#a08050">forte</text>
  <text x="473" y="255" font-family="'Inter', sans-serif" font-size="10" fill="#8a6030" text-anchor="middle" letter-spacing="1">CLASSEMENT</text>

  <!-- Arrow to archive -->
  <line x1="473" y1="230" x2="473" y2="298" stroke="#e8a838" stroke-width="1.2" marker-end="url(#pcpArrow)" opacity="0.7"/>

  <!-- Stage 3b: local archive -->
  <rect x="408" y="308" width="130" height="62" rx="6" fill="#241408" stroke="#8a6030" stroke-width="1.2" opacity="0.9"/>
  <text x="473" y="333" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#e8a838" text-anchor="middle">Archive locale</text>
  <text x="473" y="350" font-family="'Inter', sans-serif" font-size="8.5" fill="#a08050" text-anchor="middle">90 jours glissants</text>
  <text x="473" y="362" font-family="'Inter', sans-serif" font-size="8.5" fill="#a08050" text-anchor="middle">(curseur temporel)</text>

  <!-- Arrow to GeoJSON -->
  <line x1="538" y1="175" x2="591" y2="175" stroke="#e8a838" stroke-width="1.4" marker-end="url(#pcpArrow)"/>

  <!-- Stage 4: GeoJSON files -->
  <rect x="601" y="140" width="110" height="70" rx="6" fill="#2a2030" stroke="#9a6ade" stroke-width="1.3"/>
  <text x="656" y="168" font-family="'SF Mono', monospace" font-size="18" fill="#ba8ade" text-anchor="middle" opacity="0.85">{ }</text>
  <text x="656" y="188" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ba8ade" text-anchor="middle">GeoJSON</text>
  <text x="656" y="200" font-family="'Inter', sans-serif" font-size="8" fill="#8a6aaa" text-anchor="middle">public/data/</text>
  <text x="656" y="255" font-family="'Inter', sans-serif" font-size="10" fill="#8a6030" text-anchor="middle" letter-spacing="1">DONNÉES</text>

  <!-- Arrow down to leaflet-atlas / map -->
  <line x1="656" y1="210" x2="656" y2="290" stroke="#e8a838" stroke-width="1.4" marker-end="url(#pcpArrow)"/>

  <!-- Stage 5: interactive map -->
  <rect x="561" y="300" width="190" height="70" rx="6" fill="#0a2a1a" stroke="#3dba6e" stroke-width="1.4"/>
  <g transform="translate(590, 335)" opacity="0.85">
    <rect x="-10" y="-10" width="20" height="20" rx="2" fill="none" stroke="#3dba6e" stroke-width="1"/>
    <line x1="-4" y1="-10" x2="-4" y2="10" stroke="#3dba6e" stroke-width="0.6"/>
    <line x1="3" y1="-10" x2="3" y2="10" stroke="#3dba6e" stroke-width="0.6"/>
    <circle cx="-3" cy="-2" r="1.6" fill="#e8a838"/>
  </g>
  <text x="670" y="328" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#3dba6e" text-anchor="middle">leaflet-atlas</text>
  <text x="670" y="343" font-family="'Inter', sans-serif" font-size="8.5" fill="#4a7a5e" text-anchor="middle">carte + curseur temporel</text>
  <text x="670" y="355" font-family="'Inter', sans-serif" font-size="8.5" fill="#4a7a5e" text-anchor="middle">+ légende FRP</text>

  <!-- Flow line at bottom -->
  <text x="400" y="392" font-family="'Inter', sans-serif" font-size="10.5" fill="#6a5228" text-anchor="middle">satellites → récupération → classement FRP → geojson → carte interactive</text>
</svg>
